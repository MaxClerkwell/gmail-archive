[project]
name = "gmail-archive"
version = "0.1.0"
description = "Archive a Gmail mailbox into SQLite and expose it via REST and MCP"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Stephan Bökelmann", email = "bjoekeldude@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.1",
]

[project.scripts]
gmail-archive-sync = "gmail_archive.sync:main"
gmail-archive-api = "gmail_archive.api:main"
gmail-archive-mcp = "gmail_archive.mcp_server:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
